<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Travel Tracker polished orbit icon</title>
  <desc id="desc">A clean isometric purple planet with a dashed travel orbit, readable paper plane, and sparkles on a rounded purple tile.</desc>
  <defs>
    <linearGradient id="tile" x1="3" y1="2" x2="29" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#130627"/>
      <stop offset="0.48" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(22 8) rotate(126) scale(22 17)">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#8b5cf6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#130627" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planetTop" x1="9" y1="8.8" x2="23.8" y2="21.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset=".46" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="planetSide" x1="9.1" y1="17" x2="23.2" y2="27.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".58" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#130627"/>
    </linearGradient>
    <linearGradient id="planeBody" x1="20.1" y1="9" x2="27.8" y2="16.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset=".48" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="planeHighlight" x1="20.1" y1="10" x2="28.9" y2="12.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset=".68" stop-color="#f5f3ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="planeFacet" x1="23.8" y1="13" x2="27.5" y2="17.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".72" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="planeTail" x1="20.2" y1="12.6" x2="23.9" y2="16.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="planetClip">
      <ellipse cx="16" cy="15.6" rx="8.2" ry="6.7"/>
    </clipPath>
  </defs>

  <!-- Rounded app tile -->
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <rect width="32" height="32" rx="8" fill="url(#tileGlow)"/>

  <!-- Back half of dashed travel orbit -->
  <ellipse cx="16" cy="15.9" rx="12.1" ry="6.1" transform="rotate(-18 16 15.9)" fill="none" stroke="#f5f3ff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3" opacity=".72"/>

  <!-- Isometric planet shadow and body -->
  <ellipse cx="16" cy="20.6" rx="8.8" ry="4.6" fill="#130627" opacity=".32"/>
  <path d="M7.8 15.6c0-3.7 3.7-6.7 8.2-6.7s8.2 3 8.2 6.7v4.5c0 3.7-3.7 6.7-8.2 6.7s-8.2-3-8.2-6.7v-4.5Z" fill="url(#planetSide)"/>
  <ellipse cx="16" cy="15.6" rx="8.2" ry="6.7" fill="url(#planetTop)"/>

  <!-- Clean planet surface detail -->
  <g clip-path="url(#planetClip)">
    <path d="M10.1 14.6c1.5-2.2 4.1-3.4 6.9-3.1 1.9.2 3.5.9 4.5 2" fill="none" stroke="#f5f3ff" stroke-width="1.15" stroke-linecap="round" opacity=".48"/>
    <!-- Asymmetric landmass keeps the globe planetary without reading as a face. -->
    <path d="M12.1 16.5c.5-.9 1.8-1.3 3.1-1 1 .2 1.4.8 2.1 1 .8.3 1.6-.1 2.2.4.7.5.4 1.5-.3 2.1-.8.7-2 .5-3.1.2-.8-.2-1.6-.2-2.4-.1-1.1.1-2.1-.2-2.4-1-.2-.6.3-1.2.8-1.6Z" fill="#6d28d9" opacity=".36"/>
    <path d="M20.3 14.9c.5-.3 1.2-.2 1.5.1.3.4.1.9-.4 1.1-.5.3-1.2.2-1.5-.1-.3-.4-.1-.8.4-1.1Z" fill="#8b5cf6" opacity=".26"/>
  </g>
  <path d="M8 18.4c1.6 2.2 4.6 3.8 8 3.8s6.4-1.5 8-3.8v2c-.4 3.5-3.9 6.3-8 6.3s-7.6-2.8-8-6.3v-2Z" fill="#130627" opacity=".17"/>

  <!-- Front half of orbit, layered over planet -->
  <path d="M5.9 20c5.9 3.2 13.7 2.3 20.2-2.4" fill="none" stroke="#f5f3ff" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="2 3" opacity=".94"/>

  <!-- Soft glossy paper plane on the orbit -->
  <g transform="rotate(12 25.2 12.5)">
    <path d="M20.6 13.1c2 .4 4.5 1.5 6.1 3.4" fill="none" stroke="#6d28d9" stroke-width="1.1" stroke-linecap="round" opacity=".22"/>
    <path d="M19.9 12.5 29.1 8.7c.3-.1.5.2.4.4l-3.3 8c-.1.3-.4.3-.6.1L24 14l-1.4 2.2c-.1.2-.4.2-.5 0l-2.4-3.3c-.2-.2-.1-.4.2-.4Z" fill="url(#planeBody)" opacity=".98"/>
    <path d="M20 12.5h4.1l5.2-3.8-5.1 5.1-4.2-1.3Z" fill="url(#planeHighlight)" opacity=".98"/>
    <path d="M24.2 13.8 29.3 8.8l-3.1 8.1c-.1.2-.4.2-.5 0l-1.5-3.1Z" fill="url(#planeFacet)" opacity=".9"/>
    <path d="M24.2 13.8 22.6 16.1c-.1.2-.4.2-.5 0l-2.1-3.6 4.2 1.3Z" fill="url(#planeTail)" opacity=".7"/>
    <path d="M24.2 13.8 29.1 8.9" fill="none" stroke="#f5f3ff" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <path d="M24.2 13.8 26.2 16.8" fill="none" stroke="#6d28d9" stroke-width=".42" stroke-linecap="round" opacity=".28"/>
  </g>

  <!-- Chunky sparkles -->
  <path d="M6.5 7.1 7.2 8.8l1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7.7-1.7Z" fill="#f5f3ff"/>
  <path d="M25.4 23.7l.52 1.15 1.15.52-1.15.52-.52 1.15-.52-1.15-1.15-.52 1.15-.52.52-1.15Z" fill="#c4b5fd"/>
</svg>
