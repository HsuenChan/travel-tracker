<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Globe Loader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f4f1ec;
  }
  body {
    display: grid;
    place-items: center;
    font-family: ui-monospace, Menlo, monospace;
  }
  .stage {
    width: 200px;
    height: 200px;
    position: relative;
    display: grid;
    place-items: center;
  }
  .stage svg {
    display: block;
    overflow: visible;
  }

  /* Globe sphere */
  .sphere {
    fill: none;
    stroke: #161514;
    stroke-width: 1.1;
  }
  .graticule {
    fill: none;
    stroke: #161514;
    stroke-width: 0.45;
    stroke-opacity: 0.28;
  }
  .land {
    fill: #161514;
    fill-opacity: 0.92;
    stroke: none;
  }

  /* Whirl: concentric arcs that trail around the globe */
  .whirl path {
    fill: none;
    stroke: #161514;
    stroke-linecap: round;
  }

  @keyframes spinCW {
    to { transform: rotate(360deg); }
  }
  @keyframes spinCCW {
    to { transform: rotate(-360deg); }
  }

  .whirl {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
  }
  .whirl.a { animation: spinCW 4.8s linear infinite; }
  .whirl.b { animation: spinCCW 7.6s linear infinite; }
  .whirl.c { animation: spinCW 11s linear infinite; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- Whirl layers: dashed arcs at varied radii -->
  <svg class="whirl a" viewBox="-100 -100 200 200" width="200" height="200" aria-hidden="true">
    <path d="M 0,-92 A 92,92 0 0 1 75.8,-52" stroke-width="1.1" />
    <path d="M -82,-42 A 92,92 0 0 1 -52,-75.8" stroke-width="1.1" stroke-dasharray="0.1 6" />
    <circle r="96" fill="none" stroke="#161514" stroke-width="0.6" stroke-dasharray="1 9" stroke-opacity="0.55" />
  </svg>

  <svg class="whirl b" viewBox="-100 -100 200 200" width="200" height="200" aria-hidden="true">
    <path d="M 88,18 A 89.8,89.8 0 0 1 52,73" stroke-width="0.9" />
    <path d="M -74,-52 A 89.8,89.8 0 0 1 -36,-82" stroke-width="0.9" stroke-dasharray="0.1 5" />
    <circle r="104" fill="none" stroke="#161514" stroke-width="0.5" stroke-dasharray="0.1 7" stroke-opacity="0.45" />
  </svg>

  <svg class="whirl c" viewBox="-100 -100 200 200" width="200" height="200" aria-hidden="true">
    <path d="M -112,0 A 112,112 0 0 1 -80,-78" stroke-width="0.7" stroke-opacity="0.8" />
    <path d="M 108,-20 A 112,112 0 0 1 78,60" stroke-width="0.7" stroke-dasharray="0.1 8" stroke-opacity="0.8" />
    <circle r="114" fill="none" stroke="#161514" stroke-width="0.4" stroke-dasharray="0.1 11" stroke-opacity="0.35" />
  </svg>

  <!-- Globe svg, rendered via d3-geo -->
  <svg id="globe" viewBox="-100 -100 200 200" width="200" height="200" aria-label="Spinning globe">
    <defs>
      <clipPath id="sphereClip">
        <circle r="88" cx="0" cy="0" />
      </clipPath>
    </defs>
    <g clip-path="url(#sphereClip)">
      <circle class="sphere-bg" r="88" cx="0" cy="0" fill="#f4f1ec" />
      <path class="graticule" id="graticulePath" />
      <path class="land" id="landPath" />
    </g>
    <circle class="sphere" r="88" cx="0" cy="0" />
  </svg>
</div>

<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(async function () {
  const projection = d3.geoOrthographic()
    .scale(88)
    .translate([0, 0])
    .clipAngle(90);

  const path = d3.geoPath(projection);
  const graticule = d3.geoGraticule10();

  // Natural Earth 110m land topojson (small — good for a loader)
  const url = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json";
  const topo = await fetch(url).then(r => r.json());
  const land = topojson.feature(topo, topo.objects.land);

  const landEl = document.getElementById("landPath");
  const gratEl = document.getElementById("graticulePath");

  let lambda = 0; // longitude rotation
  const speed = 60; // degrees per second

  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000;
    last = now;
    lambda = (lambda + speed * dt) % 360;
    projection.rotate([lambda, -18, 0]);

    landEl.setAttribute("d", path(land) || "");
    gratEl.setAttribute("d", path(graticule) || "");

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
